name: Fetch Daily Stock Prices & Indicators

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 日本時間: 平日 16:00 JST
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch_daily.py
        run: |
          python scripts/fetch_daily.py

      - name: Commit and push if changes exist
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/daily/*.csv data/latest_summary.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update daily stock prices & indicators [$(date '+%Y-%m-%d %H:%M:%S')]"
            git push
          fi